name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies and dbt packages
        run: make setup

      - name: Generate synthetic data
        run: make generate

      - name: dbt debug
        run: make debug

      - name: dbt build (models + tests, incl. reconciliation with ground truth)
        run: make build

      - name: MetricFlow validate (semantic models + metrics)
        run: uv run mf validate-configs
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}

      - name: Python tests
        run: make test

      - name: Lint SQL
        run: make lint
