name: saas_metrics
version: "0.1.0"
config-version: 2
profile: ledgerly
require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models", "semantic_models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  saas_metrics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
