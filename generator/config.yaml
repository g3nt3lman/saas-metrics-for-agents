# Ledgerly synthetic data generator configuration.
# Every "mess" item can be toggled with `enabled` and tuned with its parameters.
# See generator/README.md for what each one does and which metric it breaks.

seed: 42
start: 2024-11-01        # first day of the simulated window
months: 24               # window length -> ends 2026-10-31
n_customers: 2000
annual_multiplier: 10    # annual price = 10x monthly (two months free)

price_change:            # month-12 list price increase; existing subscriptions grandfathered
  date: 2025-11-01
  pct: 0.15

# country: [currency, weight]
countries:
  DE: [EUR, 0.16]
  FR: [EUR, 0.10]
  NL: [EUR, 0.08]
  ES: [EUR, 0.08]
  IT: [EUR, 0.08]
  US: [USD, 0.20]
  CA: [USD, 0.05]
  GB: [USD, 0.05]
  PL: [PLN, 0.20]

# monthly list price per seat (v1), per currency
tiers:
  starter:  {EUR: 9,  USD: 10, PLN: 39}
  pro:      {EUR: 19, USD: 21, PLN: 82}
  business: {EUR: 39, USD: 43, PLN: 168}

tier_weights: {starter: 0.50, pro: 0.35, business: 0.15}
seats:                     # initial seat range [min, max]
  starter: [1, 3]
  pro: [2, 10]
  business: [5, 40]

fx:                        # daily random walk of rate_to_eur
  USD: {start: 0.92, vol: 0.004}
  PLN: {start: 0.23, vol: 0.003}

mess:
  annual_plans:       {enabled: true, share: 0.30}
  trials:             {enabled: true, days: 14, non_convert_rate: 0.35}
  plan_changes:       {enabled: true, upgrade_rate: 0.02, downgrade_rate: 0.01}
  seat_changes:       {enabled: true, increase_rate: 0.05, decrease_rate: 0.03}
  discounts:          {enabled: true, rate: 0.15, pct: 0.20, periods: 3}
  dunning:            {enabled: true, fail_rate: 0.05, recover_rate: 0.70, retry_days: [3, 5, 7], cancel_after_days: 14}
  voluntary_churn:    {enabled: true, monthly_rate: {starter: 0.03, pro: 0.02, business: 0.015}}
  refunds:            {enabled: true, rate: 0.03, partial_share: 0.6, later_month_share: 0.3}
  fx_gaps:            {enabled: true}
  reactivations:      {enabled: true, rate: 0.15, min_months: 1, max_months: 9}
  one_off:            {enabled: true, rate: 0.5, amount: {EUR: 500, USD: 550, PLN: 2150}}
  price_change:       {enabled: true}
  duplicate_events:   {enabled: true, rate: 0.02}
  late_events:        {enabled: true, rate: 0.03, min_days: 3, max_days: 40}
  internal_customers: {enabled: true, rate: 0.01}
  soft_deleted:       {enabled: true, junk_rate: 0.01, churned_rate: 0.05}
  timezone_trap:      {enabled: true, boundary_cases: 5}
