version: 2

models:
  - name: stg_ledgerly__customers
    description: One row per customer. Adds email_domain and is_internal (@ledgerly.io test accounts). Soft-deleted rows are kept.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: is_internal
        description: True for Ledgerly's own test accounts (email domain ledgerly.io). Excluded from all metrics.
      - name: is_deleted
        description: Soft-delete flag. No deletion timestamp exists; history is kept in metrics.

  - name: stg_ledgerly__plans
    description: One row per price version. A price change creates a new plan_id (price_version 1 → 2).
    columns:
      - name: plan_id
        data_tests: [unique, not_null]
      - name: billing_interval
        data_tests:
          - accepted_values:
              arguments:
                values: [month, year]
      - name: months_per_interval
        description: 1 for monthly plans, 12 for annual plans. MRR = unit_amount × quantity ÷ months_per_interval.

  - name: stg_ledgerly__subscriptions
    description: One row per subscription. A reactivated customer gets a new subscription.
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ledgerly__customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [trialing, active, past_due, canceled, incomplete_expired]

  - name: stg_ledgerly__subscription_items
    description: One row per item version (plan and seat state). valid_to is null for the current version.
    columns:
      - name: subscription_item_id
        data_tests: [unique, not_null]
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ledgerly__subscriptions')
                field: subscription_id
      - name: plan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ledgerly__plans')
                field: plan_id

  - name: stg_ledgerly__invoices
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, open, uncollectible]

  - name: stg_ledgerly__invoice_line_items
    columns:
      - name: invoice_line_item_id
        data_tests: [unique, not_null]
      - name: invoice_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ledgerly__invoices')
                field: invoice_id
      - name: line_type
        data_tests:
          - accepted_values:
              arguments:
                values: [subscription, proration, one_off, discount]

  - name: stg_ledgerly__payments
    description: One row per payment attempt.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: attempted_at
        description: Attempt time as timestamptz (UTC), parsed from the mixed-offset string attempted_at_raw.
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [succeeded, failed]

  - name: stg_ledgerly__refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: payment_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ledgerly__payments')
                field: payment_id

  - name: stg_ledgerly__fx_rates
    description: Rate to EUR per currency and business day. No weekend rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency]

  - name: stg_ledgerly__events
    description: Webhook events, deduplicated on event_id (first delivery wins).
    columns:
      - name: event_id
        data_tests: [unique, not_null]
