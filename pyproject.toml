[project]
name = "saas-metrics-for-agents"
version = "0.1.0"
description = "Governed SaaS metrics layer (dbt + MetricFlow on DuckDB) exposed to LLM agents via MCP"
requires-python = ">=3.11"
dependencies = [
    "dbt-core~=1.11.0",
    "dbt-duckdb>=1.11.1",
    "dbt-metricflow[duckdb]>=0.15.0",
    "duckdb>=2.0.0",
    "faker>=40.54.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
pythonpath = ["generator"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
